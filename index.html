<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Video Editing Portfolio | Cinematic Reels</title>
    <meta name="description" content="Cinematic AI video and editing portfolio: talking head, UGC, b-roll, reels and long-form work, organised into shareable category reels." />
    <meta name="author" content="Caleb Peters" />

    <!-- Imperial Script for the wordmark, Cormorant Garamond for headings,
         Jost for everything else. Loaded here rather than via @import in
         index.css so the browser starts fetching while CSS is still parsing.
         The stacks in tailwind.config.ts fall back to the visitor's own fonts
         if Google Fonts is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    />

    <!-- Link previews. scripts/profile-meta.mjs rewrites these per profile after the build. -->
    <meta property="og:title" content="AI Video Editing Portfolio | Cinematic Reels" />
    <meta property="og:description" content="Cinematic AI video and editing portfolio: talking head, UGC, b-roll, reels and long-form work, organised into shareable category reels." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Video Editing Portfolio | Cinematic Reels" />
    <meta name="twitter:description" content="Cinematic AI video and editing portfolio: talking head, UGC, b-roll, reels and long-form work, organised into shareable category reels." />
    <meta name="twitter:image" content="/og/default.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
